<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canal K16 - TV en Vivo</title>   

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(to bottom,#0b1c3a,#1b2c55);
    color:white;
    display:flex;
    justify-content:center;
    user-select:none; /* evita selección */
    -webkit-user-select:none;
}

/* HEADER */
.app{
    width:100%;
    max-width:1100px;
    padding:15px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.live{
    background:red;
    padding:5px 10px;
    border-radius:8px;
    font-weight:bold;
}

/* PLAYER */
.player-box{
    width:100%;
    max-width:900px;
    margin:auto;
    background:black;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio:16/9;
    box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.player-box video,
.player-box iframe{
    width:100%;
    height:100%;
    border:none;
}

/* CANALES */
.lista{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
    margin-top:15px;
}

.canal{
    background:linear-gradient(145deg,#1b2c55,#0b1c3a);
    padding:10px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}

.canal:hover{
    transform:scale(1.05);
}

.canal img{
    width:100%;
    height:65px;
    object-fit:cover;
    border-radius:10px;
}

.canal.activo{
    outline:2px solid #00b7ff;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>EN VIVO</div>
        <div class="live">● Canal K16</div>
        <div>Streaming</div>
    </div>

    <div class="player-box" id="playerBox"></div>

// Bloquear teclas de inspección
document.addEventListener("keydown", function(e){
    if(
        e.key === "F12" ||
        (e.ctrlKey && e.key.toLowerCase() === "u") ||
        (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()))
    ){

});

  { n:"Portal Fox Mix", u:"https://panel.tvstream.cl:1936/8040/8040/playlist.m3u8", l:"https://www.portalfoxmix.cl/web/wp-content/uploads/2016/03/logoPFM.png" }

];

const playerBox = document.getElementById("playerBox");
const lista = document.getElementById("lista");

let hls;

// crear canales
canales.forEach(c=>{
    const div=document.createElement("div");
    div.className="canal";
    div.innerHTML=`<img src="${c.l}"><div>${c.n}</div>`;

    div.onclick=()=>{
        document.querySelectorAll(".canal").forEach(e=>e.classList.remove("activo"));
        div.classList.add("activo");
        play(c.u);
    };

    lista.appendChild(div);
});

// player
function play(url){

    if(hls){
        hls.destroy();
        hls=null;
    }

    playerBox.innerHTML="";

    if(url.includes(".m3u8")){

        const video=document.createElement("video");
        video.controls=true;
        video.autoplay=true;
        video.muted=true;
        video.playsInline=true;

        playerBox.appendChild(video);

        if(Hls.isSupported()){
            hls=new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED,()=>{
                video.play().catch(()=>{});
            });
        } else {
            video.src=url;
        }

    } else {
        playerBox.innerHTML=`<iframe src="${url}" allowfullscreen></iframe>`;
    }
}

// inicio automático
play(canales[0].u);

</script>
